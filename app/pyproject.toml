[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "njmu-campus-net-assistant"
dynamic = ["version"]
description = "NJMU Windows campus network login and reconnect assistant"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.8,<2", "PySide6>=6.11.1,<7"]
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]

[project.scripts]
campus-net-assistant = "campus_net_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "campus_net_assistant.version.VERSION"}

[tool.setuptools.package-data]
campus_net_assistant = ["native/bin/RawetherBridge.exe"]
